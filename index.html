<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Beachday</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
  }

  body {
    background-image:
      radial-gradient(#111 1px, transparent 1px),
      radial-gradient(#111 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  canvas#fx {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    pointer-events: none;
  }

  #flash {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  h1#title {
    position: relative;
    z-index: 2;
    margin: 0;
    padding: 0 0.3em;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    font-size: clamp(1.6rem, 8vw, 5.5rem);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .letter {
    display: inline-block;
    font-weight: 900;
    opacity: 0;
    transform: scale(0) rotate(0deg);
    color: #ffee00;
    text-shadow:
      3px 3px 0 #ff2fd1,
      6px 6px 0 #00e5ff,
      0 0 20px rgba(255, 238, 0, 0.6);
  }

  .letter.show {
    animation: pop 0.55s cubic-bezier(.2, 1.6, .4, 1) forwards;
  }

  .space {
    display: inline-block;
    width: 0.5em;
  }

  @keyframes pop {
    0%   { opacity: 0; transform: scale(0) rotate(-25deg); }
    55%  { opacity: 1; transform: scale(1.35) rotate(6deg); }
    75%  { opacity: 1; transform: scale(0.9) rotate(-3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .shake {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 4px); }
    40% { transform: translate(6px, -4px); }
    60% { transform: translate(-4px, -6px); }
    80% { transform: translate(4px, 6px); }
  }

  #sub {
    position: relative;
    z-index: 2;
    margin-top: 1.2rem;
    color: #00e5ff;
    font-size: clamp(0.7rem, 2.2vw, 1.1rem);
    letter-spacing: 0.3em;
    opacity: 0;
    text-align: center;
  }

  #sub.show {
    opacity: 1;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0.25; }
  }

  #badge {
    position: absolute;
    bottom: 14px;
    width: 100%;
    text-align: center;
    z-index: 2;
    color: #ff2fd1;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    opacity: 0;
  }

  #badge.show { opacity: 0.85; }

  @media (prefers-reduced-motion: reduce) {
    .letter { opacity: 1 !important; transform: none !important; animation: none !important; }
    #sub { opacity: 1 !important; animation: none !important; }
    #badge { opacity: 0.85 !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="fx"></canvas>
    <div id="flash"></div>
    <h1 id="title" aria-label="RYAN BEACH DAY"></h1>
    <div id="sub">- WELCOME TO THE SITE -</div>
    <div id="badge">BEST VIEWED AT 800x600 // NETSCAPE READY</div>
  </div>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TEXT = 'RYAN BEACH DAY';
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var badgeEl = document.getElementById('badge');
  var stageEl = document.getElementById('stage');
  var flashEl = document.getElementById('flash');
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');

  var PIXEL = 4;
  var COLORS = ['#ff2fd1', '#00e5ff', '#ffee00', '#ff5a00', '#39ff14', '#ffffff'];

  function resizeCanvas() {
    canvas.width = Math.ceil(window.innerWidth / PIXEL);
    canvas.height = Math.ceil(window.innerHeight / PIXEL);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  ctx.imageSmoothingEnabled = false;

  var particles = [];

  function spawnBurst(xCss, yCss, count, colors) {
    var x = xCss / PIXEL;
    var y = yCss / PIXEL;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 1.2 + Math.random() * 3.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 1 + Math.floor(Math.random() * 2),
        life: 28 + Math.random() * 20,
        maxLife: 28 + Math.random() * 20,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  var running = true;
  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= 1;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function buildLetters() {
    TEXT.split('').forEach(function (ch) {
      var span = document.createElement('span');
      if (ch === ' ') {
        span.className = 'space';
      } else {
        span.className = 'letter';
        span.textContent = ch;
      }
      titleEl.appendChild(span);
    });
  }
  buildLetters();

  var letterEls = Array.prototype.slice.call(titleEl.querySelectorAll('.letter'));

  function centerOf(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function revealAll() {
    letterEls.forEach(function (el) { el.classList.add('show'); });
    subEl.classList.add('show');
    badgeEl.classList.add('show');
  }

  function playIntro() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;

    flashEl.style.transition = 'opacity 0.5s ease';
    flashEl.style.opacity = '0.9';
    spawnBurst(cx, cy, 90, COLORS);

    setTimeout(function () {
      flashEl.style.opacity = '0';
    }, 90);

    var stagger = 70;
    letterEls.forEach(function (el, i) {
      setTimeout(function () {
        var c = centerOf(el);
        spawnBurst(c.x, c.y, 14, COLORS);
        el.classList.add('show');
      }, 350 + i * stagger);
    });

    var totalLetterTime = 350 + letterEls.length * stagger;
    setTimeout(function () {
      stageEl.classList.add('shake');
      spawnBurst(cx, cy, 60, COLORS);
      subEl.classList.add('show');
      badgeEl.classList.add('show');
    }, totalLetterTime + 150);

    setTimeout(function () {
      stageEl.classList.remove('shake');
    }, totalLetterTime + 600);
  }

  if (reduceMotion) {
    revealAll();
    running = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  } else {
    playIntro();
  }
})();
</script>
</body>
</html>
